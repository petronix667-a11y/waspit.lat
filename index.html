<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waspit | iOS_Vault</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 210, 106, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Contenedor maestro para que tarjeta y anuncio vayan en columna centrados */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 420px;
        }

        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 0 20px rgba(88, 101, 242, 0.3);
            overflow: hidden;
            padding: 0; /* Quitamos el relleno para que la foto ocupe todo el espacio */
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que la imagen cubra todo el círculo sin deformarse */
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.bio {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 106, 0.1);
            color: #00d26a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00d26a;
            border-radius: 50%;
            box-shadow: 0 0 8px #00d26a;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- Tu Tarjeta Principal -->
        <div class="card">
            <div class="avatar">
                <img src="https://raw.githubusercontent.com/petronix667-a11y/waspit.lat/refs/heads/main/perfil.png" alt="Logo iOS_Vault">
            </div>
            <h1>¡Bienvenido!</h1>
            <p class="bio">¡Aqui encontraras todas las redes oficiales de 🍏iOS_Vault📱!.</p>
            
            <div class="status">
                <span class="dot"></span> ¡En Linea!
            </div>

            <div class="btn-group">
            <a href="https://discord.gg/5cpgHbUxM4" class="btn" target="_blank">
                <i class="fa-brands fa-discord"></i> Server de Discord
            </a>
            <a href="https://www.youtube.com/@iOS_Vault-u2n" class="btn" target="_blank">
                <i class="fa-brands fa-youtube"></i> Canal de Youtube
            </a>
            <a href="https://www.instagram.com/ios_vaultt/" class="btn" target="_blank">
                <i class="fa-brands fa-instagram"></i> Cuenta de Instagram
            </a>
        </div>

            <footer>
                waspit.lat &bull; 2026
            </footer>
        </div>

        <!-- Bloque de publicidad Adsterra ordenado abajo y centrado -->
        <div style="width: 100%; max-width: 300px; margin-top: 20px; display: flex; justify-content: center; overflow: hidden;">
            <script async="async" data-cfasync="false" src="https://bicea.org/21/0af9a236e923b94d0e6e481411551df3"></script>
            <div id="container-0af9a236e923b94d0e6e481411551df3"></div>
        </div>
    </div>

</body>
</html>
