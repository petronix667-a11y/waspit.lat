<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waspit | iOS_Vault</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0f19;
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 210, 106, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.05); /* Fondo sutil para que resalte el icono */
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
    box-shadow: 0 0 20px rgba(88, 101, 242, 0.3); /* Brillo azul estilo Discord */
    overflow: hidden;
    padding: 18px; /* Controla el tamaño de la imagen dentro del círculo */
}

.avatar img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
        

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.bio {
            color: #9ca3af;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 106, 0.1);
            color: #00d26a;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #00d26a;
            border-radius: 50%;
            box-shadow: 0 0 8px #00d26a;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 12px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">
    <img src="https://cdn.prod.website-files.com/6257adef93867e50d84d30e2/636e0a6a49cf127bf92de1e2_icon_clyde_blurple_RGB.png" alt="Discord">
</div>
        <h1>¡Bienvenido!</h1>
        <p class="bio">En el siguiente botón encontraras el servidor de Discord oficial de ⬇️iOS_Vault⬇️.</p>
        
        <div class="status">
            <span class="dot"></span> En desarrollo!
            
        </div>

        <div class="btn-group">
            <a href="https://discord.gg/5cpgHbUxM4" class="btn" target="_blank">Server de Discord</a>
        </div>

        <footer>
            waspit.lat &bull; 2026
        </footer>
    </div>

</body>
</html>
